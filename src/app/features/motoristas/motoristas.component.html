<div class="page"><div class="page-header"><div><h1 class="page-title">Motoristas</h1><p class="page-subtitle">Dados dos condutores e CNH.</p></div><button class="btn btn-primary" (click)="novo()">Novo motorista</button></div><div class="alert error" *ngIf="erro">{{erro}}</div><div class="alert success" *ngIf="sucesso">{{sucesso}}</div>
<form class="card panel" *ngIf="mostrarForm" [formGroup]="form" (ngSubmit)="salvar()"><div class="form-grid"><div><label>Nome</label><input class="input" formControlName="nome"></div><div><label>CPF</label><input class="input" formControlName="cpf"></div><div><label>Telefone</label><input class="input" formControlName="telefone"></div><div><label>CNH</label><input class="input" formControlName="cnh"></div><div><label>Categoria CNH</label><input class="input" formControlName="categoriaCnh"></div><div><label>Validade CNH</label><input class="input" type="date" formControlName="validadeCnh"></div><div><label>Status</label><select formControlName="status"><option [ngValue]="null">Manter padrão</option><option *ngFor="let o of statusOptions" [value]="o">{{label(o)}}</option></select></div><div class="span-2"><label>Observação</label><input class="input" formControlName="observacao"></div></div><div class="actions" style="margin-top:14px"><button class="btn btn-success">Salvar</button><button class="btn btn-secondary" type="button" (click)="mostrarForm=false">Cancelar</button></div></form>
<div class="card panel"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>CNH</th><th>Validade</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr *ngFor="let m of itens"><td><strong>{{m.nome}}</strong></td><td>{{m.telefone || '-'}}</td><td>{{m.cnh || '-'}}</td><td>{{m.validadeCnh || '-'}}</td><td><span class="badge">{{label(m.status)}}</span></td><td class="actions"><button class="btn btn-secondary" (click)="editar(m)">Editar</button><button class="btn btn-danger" (click)="deletar(m.id)">Excluir</button></td></tr></tbody></table></div><div class="empty" *ngIf="!itens.length">Nenhum motorista cadastrado.</div></div></div>
