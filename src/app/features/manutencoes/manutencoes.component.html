<div class="page"><div class="page-header"><div><h1 class="page-title">Manutenções</h1><p class="page-subtitle">Histórico, custos e controle de status do veículo.</p></div><button class="btn btn-primary" (click)="novo()">Nova manutenção</button></div><div class="alert error" *ngIf="erro">{{erro}}</div><div class="alert success" *ngIf="sucesso">{{sucesso}}</div>
<form class="card panel" *ngIf="mostrarForm" [formGroup]="form" (ngSubmit)="salvar()"><div class="form-grid"><div><label>Veículo</label><select formControlName="veiculoId"><option [ngValue]="null">Selecione</option><option *ngFor="let v of veiculos" [ngValue]="v.id">{{v.placa}} - {{v.modelo}}</option></select></div><div><label>Tipo</label><select formControlName="tipo"><option *ngFor="let o of tipos" [value]="o">{{label(o)}}</option></select></div><div><label>Status</label><select formControlName="status"><option [ngValue]="null">Manter padrão</option><option *ngFor="let o of status" [value]="o">{{label(o)}}</option></select></div><div><label>Data</label><input class="input" type="date" formControlName="dataManutencao"></div><div><label>KM atual</label><input class="input" type="number" formControlName="kmAtual"></div><div><label>Oficina</label><input class="input" formControlName="oficina"></div><div><label>Custo peças</label><input class="input" type="number" formControlName="custoPecas"></div><div><label>Custo mão de obra</label><input class="input" type="number" formControlName="custoMaoObra"></div><div><label>Próxima KM</label><input class="input" type="number" formControlName="proximaManutencaoKm"></div><div><label>Próxima data</label><input class="input" type="date" formControlName="proximaManutencaoData"></div><div class="span-2"><label>Descrição</label><input class="input" formControlName="descricao"></div><div class="span-3"><label>Observação</label><input class="input" formControlName="observacao"></div></div><div class="actions" style="margin-top:14px"><button class="btn btn-success">Salvar</button><button class="btn btn-secondary" type="button" (click)="mostrarForm=false">Cancelar</button></div></form>
<div class="card panel"><div class="table-wrap"><table><thead><tr><th>Data</th><th>Veículo</th><th>Tipo</th><th>Status</th><th>Custo</th><th>Descrição</th><th>Ações</th></tr></thead><tbody><tr *ngFor="let m of itens"><td>{{m.dataManutencao}}</td><td><strong>{{m.veiculoPlaca}}</strong></td><td>{{label(m.tipo)}}</td><td><span class="badge">{{label(m.status)}}</span></td><td>{{m.custoTotal | currency:'BRL':'symbol':'1.2-2':'pt-BR'}}</td><td>{{m.descricao}}</td><td class="actions"><button class="btn btn-secondary" (click)="editar(m)">Editar</button><button class="btn btn-warning" (click)="iniciar(m.id)">Iniciar</button><button class="btn btn-success" (click)="concluir(m.id)">Concluir</button><button class="btn btn-danger" (click)="cancelar(m.id)">Cancelar</button></td></tr></tbody></table></div></div></div>
