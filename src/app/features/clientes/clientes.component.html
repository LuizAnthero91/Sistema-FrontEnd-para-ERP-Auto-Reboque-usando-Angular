<div class="page"><div class="page-header"><div><h1 class="page-title">Clientes</h1><p class="page-subtitle">Clientes particulares, empresas, oficinas e seguradoras.</p></div><button class="btn btn-primary" (click)="novo()">Novo cliente</button></div><div class="alert error" *ngIf="erro">{{erro}}</div><div class="alert success" *ngIf="sucesso">{{sucesso}}</div>
<form class="card panel" *ngIf="mostrarForm" [formGroup]="form" (ngSubmit)="salvar()"><div class="form-grid"><div><label>Nome</label><input class="input" formControlName="nome"></div><div><label>Documento</label><input class="input" formControlName="documento"></div><div><label>Telefone</label><input class="input" formControlName="telefone"></div><div><label>Email</label><input class="input" formControlName="email"></div><div><label>Tipo</label><select formControlName="tipo"><option *ngFor="let o of tipoOptions" [value]="o">{{label(o)}}</option></select></div><div><label>Status</label><select formControlName="status"><option [ngValue]="null">Manter padrão</option><option *ngFor="let o of statusOptions" [value]="o">{{label(o)}}</option></select></div><div class="span-2"><label>Endereço</label><input class="input" formControlName="endereco"></div><div><label>Observação</label><input class="input" formControlName="observacao"></div></div><div class="actions" style="margin-top:14px"><button class="btn btn-success">Salvar</button><button class="btn btn-secondary" type="button" (click)="mostrarForm=false">Cancelar</button></div></form>
<div class="card panel"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Documento</th><th>Telefone</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr *ngFor="let c of itens"><td><strong>{{c.nome}}</strong></td><td>{{label(c.tipo)}}</td><td>{{c.documento || '-'}}</td><td>{{c.telefone || '-'}}</td><td><span class="badge">{{label(c.status)}}</span></td><td class="actions"><button class="btn btn-secondary" (click)="editar(c)">Editar</button><button class="btn btn-danger" (click)="deletar(c.id)">Excluir</button></td></tr></tbody></table></div><div class="empty" *ngIf="!itens.length">Nenhum cliente cadastrado.</div></div></div>
