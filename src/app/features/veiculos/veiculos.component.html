<div class="page"><div class="page-header"><div><h1 class="page-title">Veículos</h1><p class="page-subtitle">Cadastro da frota e status operacional.</p></div><button class="btn btn-primary" (click)="novo()">Novo veículo</button></div>
<div class="alert error" *ngIf="erro">{{erro}}</div><div class="alert success" *ngIf="sucesso">{{sucesso}}</div>
<form class="card panel" *ngIf="mostrarForm" [formGroup]="form" (ngSubmit)="salvar()"><div class="form-grid">
<div><label>Placa</label><input class="input" formControlName="placa"></div><div><label>Marca</label><input class="input" formControlName="marca"></div><div><label>Modelo</label><input class="input" formControlName="modelo"></div>
<div><label>Ano</label><input class="input" type="number" formControlName="ano"></div><div><label>Tipo</label><select formControlName="tipo"><option *ngFor="let o of tipoOptions" [value]="o">{{label(o)}}</option></select></div><div><label>Status</label><select formControlName="status"><option [ngValue]="null">Manter padrão</option><option *ngFor="let o of statusOptions" [value]="o">{{label(o)}}</option></select></div>
<div><label>KM atual</label><input class="input" type="number" formControlName="kmAtual"></div><div class="span-2"><label>Observação</label><input class="input" formControlName="observacao"></div></div><div class="actions" style="margin-top:14px"><button class="btn btn-success">Salvar</button><button class="btn btn-secondary" type="button" (click)="mostrarForm=false">Cancelar</button></div></form>
<div class="card panel"><div class="table-wrap"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Tipo</th><th>Status</th><th>KM</th><th>Ações</th></tr></thead><tbody><tr *ngFor="let v of itens"><td><strong>{{v.placa}}</strong></td><td>{{v.marca}} {{v.modelo}}</td><td>{{label(v.tipo)}}</td><td><span class="badge">{{label(v.status)}}</span></td><td>{{v.kmAtual}}</td><td class="actions"><button class="btn btn-secondary" (click)="editar(v)">Editar</button><button class="btn btn-danger" (click)="deletar(v.id)">Excluir</button></td></tr></tbody></table></div><div class="empty" *ngIf="!itens.length">Nenhum veículo cadastrado.</div></div></div>
