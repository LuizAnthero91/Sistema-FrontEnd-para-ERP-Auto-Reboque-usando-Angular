<section class="auth-page">

  <div class="auth-card card">

    <div class="auth-hero">

      <div class="auth-hero-content">

        <span class="hero-kicker">
          Segurança da conta
        </span>

        <h1>
          Recuperação de senha
        </h1>

        <p>
          Receba por e-mail um link
          seguro para criar uma nova
          senha de acesso ao sistema.
        </p>

      </div>

    </div>


    <form
      [formGroup]="form"
      (ngSubmit)="enviar()"
      class="auth-form"
    >

      <h2>
        Esqueceu sua senha?
      </h2>

      <p class="muted">
        Informe o e-mail cadastrado
        no ERP Auto Reboque Torá.
      </p>


      <div
        class="alert error"
        *ngIf="erro"
      >
        {{ erro }}
      </div>


      <div
        class="alert success"
        *ngIf="mensagem"
      >
        {{ mensagem }}
      </div>


      <div>

        <label for="email">
          Email
        </label>

        <input
          id="email"
          class="input"
          type="email"
          formControlName="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
        >

      </div>


      <button
        class="btn btn-primary"
        type="submit"
        [disabled]="loading"
      >

        {{
          loading
            ? 'Enviando...'
            : 'Enviar link de recuperação'
        }}

      </button>


      <div class="back-login">

        <a routerLink="/login">
          Voltar para o login
        </a>

      </div>

    </form>

  </div>

</section>
