<div class="page"><div class="page-header"><div><h1 class="page-title">Abastecimentos</h1><p class="page-subtitle">Lançamento de diesel com despesa automática.</p></div><button class="btn btn-primary" (click)="novo()">Novo abastecimento</button></div><div class="alert error" *ngIf="erro">{{erro}}</div><div class="alert success" *ngIf="sucesso">{{sucesso}}</div>
<form class="card panel" *ngIf="mostrarForm" [formGroup]="form" (ngSubmit)="salvar()"><div class="form-grid"><div><label>Veículo</label><select formControlName="veiculoId"><option [ngValue]="null">Selecione</option><option *ngFor="let v of veiculos" [ngValue]="v.id">{{v.placa}} - {{v.modelo}}</option></select></div><div><label>Motorista</label><select formControlName="motoristaId"><option [ngValue]="null">Opcional</option><option *ngFor="let m of motoristas" [ngValue]="m.id">{{m.nome}}</option></select></div><div><label>Data</label><input class="input" type="date" formControlName="dataAbastecimento"></div><div><label>KM atual</label><input class="input" type="number" formControlName="kmAtual"></div><div><label>Litros</label><input class="input" type="number" formControlName="litros"></div><div><label>Valor/litro</label><input class="input" type="number" formControlName="valorLitro"></div><div><label>Posto</label><input class="input" formControlName="posto"></div><div class="span-2"><label>Observação</label><input class="input" formControlName="observacao"></div></div><div class="actions" style="margin-top:14px"><button class="btn btn-success">Salvar</button><button class="btn btn-secondary" type="button" (click)="mostrarForm=false">Cancelar</button></div></form>
<div class="card panel"><div class="table-wrap"><table><thead><tr><th>Data</th><th>Veículo</th><th>Motorista</th><th>KM</th><th>Litros</th><th>Total</th><th>Ações</th></tr></thead><tbody><tr *ngFor="let a of itens"><td>{{a.dataAbastecimento}}</td><td><strong>{{a.veiculoPlaca}}</strong> {{a.veiculoModelo}}</td><td>{{a.motoristaNome || '-'}}</td><td>{{a.kmAtual}}</td><td>{{a.litros}}</td><td>{{a.valorTotal | currency:'BRL':'symbol':'1.2-2':'pt-BR'}}</td><td><button class="btn btn-danger" (click)="deletar(a.id)">Excluir</button></td></tr></tbody></table></div></div></div>
